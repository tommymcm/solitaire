<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Capture</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 4px solid #334155;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            height: auto;
            outline: none;
        }
        #status {
            margin-bottom: 1rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .controls-hint {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="status">Loading Menagerie...</div>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div class="controls-hint">Use your Mouse to select cards and click action buttons.</div>
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() { return function(text) { console.log(text); }; })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("mousedown", function(e) { window.focus(); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
                if (text === "") statusElement.style.display = 'none';
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Done!');
            }
        };
        Module.setStatus('Downloading Game Data...');
    </script>
    {{{ SCRIPT }}}
</body>
</html>
